<!DOCTYPE html>
<html>
<head>
    <title>Support CRM</title>
    <style>
        #reply_modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        #reply_box {
            background-color: white;
            width: 500px;
            padding: 20px;
            margin: 100px auto;
            border: 1px solid black;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .ticket-id {
            width: 7%;
        }

        .customer-name {
            width: 10%;
        }

        .customer-email {
            width: 13%;
        }

        .subject {
            width: 12%;
        }

        .description {
            width: 20%;
        }

        .status {
            width: 8%;
        }

        .date {
            width: 12%;
        }

        .action {
            width: 8%;
        }

        .note-ticket-id {
            width: 15%;
        }

        .note-text {
            width: 55%;
        }

        .note-date {
            width: 20%;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }
        
        .search-container {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-container button {
            width: 100px;
            padding: 10px;
            font-size: 16px;
        }

        .dashboard-link {
            position: absolute;
            top: 20px;
            right: 20px;
            text-decoration: none;
            color: white;
            background-color: #333;
            padding: 8px 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <a href="/" class="dashboard-link">Dashboard</a>

    <h1>Notes</h1>
    <div class="search-container">
        <form method="get" action="/notes_report" style="display: flex; width: 100%; gap: 10px;">
            <input
                type="text"
                name="query"
                placeholder="Search tickets..."
                value="{{ query }}"
            >
            <button type="submit">Search</button>

            <a  href="/notes_report">
                <button type="button">Clear</button>
            </a>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th class="note-ticket-id">Ticket ID</th>
                    <th class="note-text">Note</th>
                    <th class="note-date">Reply</th>
                </tr>
            </thead>
            <tbody>
                {% if notes %}
                    {% for note in notes %}
                    <tr>
                        <td>{{ note.id }}</td>
                        <td>{{ note.ticket_id }}</td>
                        <td>{{ note.note_text }}</td>
                        <td>{{ note.created_at }}</td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="4" style="text-align: center;">
                            No notes found
                        </td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
