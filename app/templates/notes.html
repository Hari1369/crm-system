<!DOCTYPE html>
<html>
<head>
    <title>Support CRM</title>
    <style>
        /* Modal background */
        #reply_modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        #reply_box {
            background-color: white;
            width: 500px;
            padding: 20px;
            margin: 100px auto;
            border: 1px solid black;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .ticket-id {
            width: 7%;
        }

        .customer-name {
            width: 10%;
        }

        .customer-email {
            width: 13%;
        }

        .subject {
            width: 12%;
        }

        .description {
            width: 20%;
        }

        .status {
            width: 8%;
        }

        .date {
            width: 12%;
        }

        .action {
            width: 8%;
        }

        .note-ticket-id {
            width: 15%;
        }

        .note-text {
            width: 55%;
        }

        .note-date {
            width: 20%;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <h1>Notes</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th class="note-ticket-id">Ticket ID</th>
                    <th class="note-text">Note</th>
                    <th class="note-date">Reply</th>
                </tr>
            </thead>
            <tbody>
                {% for note in notes %}
                <tr>
                    <td>{{ note.id }}</td>
                    <td>{{ note.ticket_id }}</td>
                    <td>{{ note.note_text }}</td>
                    <td>{{ note.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
